services:
  redis:
    image: redis:7-alpine
    container_name: anthrilo_redis
    ports:
      - "6380:6379"   # Use 6380 on host to avoid conflict with local Redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anthrilo_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - UNICOMMERCE_SYNC_ENABLE_SCHEDULER=false
    volumes:
      - ./backend:/app        # hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  sync_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anthrilo_sync_worker
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - UNICOMMERCE_SYNC_ENABLE_SCHEDULER=true
    volumes:
      - ./backend:/app
    command: python -m app.workers.unicommerce_scheduler_worker
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  recovery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anthrilo_recovery_worker
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - UNICOMMERCE_RECOVERY_ENABLE=true
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app:celery_app worker -l INFO -Q recovery --concurrency=1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: anthrilo_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
